name: Publish testing 0.1.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bump testing to 0.1.1 (runtime only, not committed)
        working-directory: framework/testing
        run: |
          node -e "const f='package.json';const p=require('./'+f);p.version='0.1.1';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          node -p "'publishing '+require('./package.json').name+'@'+require('./package.json').version"
      - name: Publish
        working-directory: framework/testing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
