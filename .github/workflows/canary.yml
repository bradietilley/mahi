name: Canary publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Publish a throwaway package under the same scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p /tmp/canary && cd /tmp/canary
          cat > package.json <<'JSON'
          {
            "name": "@mahiframework/canary-probe",
            "version": "0.0.1",
            "description": "throwaway probe, will be unpublished",
            "license": "MIT",
            "private": false
          }
          JSON
          echo "probe" > README.md
          npm publish --access public
