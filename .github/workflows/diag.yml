name: Token diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Who does the token think we are?
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/who.json -w "%{http_code}" \
            -H "Authorization: Bearer ${NPM_TOKEN}" \
            https://registry.npmjs.org/-/whoami)
          echo "whoami HTTP: $code"
          cat /tmp/who.json; echo
          echo "--- token length (no value leaked) ---"
          echo -n "${NPM_TOKEN}" | wc -c
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
